name: Responsive avatar stabilizer audit

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - '.github/workflows/responsive-avatar-stabilizer-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate responsive avatar stabilizer invariants
        shell: bash
        run: |
          git diff --check c07cea3801a11ba100d5a465935906895debbf63..HEAD
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs').read_text(encoding='utf-8')
          settings = Path('Assets/GoldenNeedle/Core/Motion/Stabilization/CanonicalStabilizerSettings.cs').read_text(encoding='utf-8')
          stabilizer = Path('Assets/GoldenNeedle/Core/Motion/Stabilization/CanonicalPoseStabilizer.cs').read_text(encoding='utf-8')
          retargeter = Path('Assets/GoldenNeedle/Core/Motion/Retargeting/HumanoidRetargeter.cs').read_text(encoding='utf-8')
          locomotion = Path('Assets/GoldenNeedle/Core/Motion/Locomotion/EmbodiedLocomotionController.cs').read_text(encoding='utf-8')
          presenter = Path('Assets/GoldenNeedle/Debug/PoseTrackingSpike/PoseTrackingSpikePresenter.cs').read_text(encoding='utf-8')

          def require(text, items, label):
              missing = [item for item in items if item not in text]
              if missing:
                  raise SystemExit(f'{label}: missing {missing}')

          require(runtime, [
              'StabilizedCanonical = 0,',
              'RawCanonical = 1,',
              'ResponsiveCanonicalA = 2,',
              'ResponsiveCanonicalB = 3,',
              'avatarDrivePoseSource = AvatarDrivePoseSource.StabilizedCanonical;',
          ], 'enum/default serialization')

          require(settings, [
              'public float acquireConfidence = 0.60f;',
              'public float sustainConfidence = 0.40f;',
              'public int acquireSamples = 2;',
              'public float lossGraceSeconds = 0.10f;',
              'public float resetAfterLossSeconds = 0.25f;',
              'public float minCutoff = 1f;',
              'public float beta = 0.05f;',
              'public float derivativeCutoff = 1f;',
              'public float defaultDeltaTimeSeconds = 0.05f;',
              'public float maximumDeltaTimeSeconds = 0.25f;',
          ], 'existing stable profile')
          require(stabilizer, ['public void Stabilize('], 'existing stabilizer surface')

          require(runtime, [
              'private const float ResponsiveAMinCutoff = 1.5f;',
              'private const float ResponsiveABeta = 0.25f;',
              'private const float ResponsiveBMinCutoff = 2.0f;',
              'private const float ResponsiveBBeta = 0.50f;',
              'private const float ResponsiveDerivativeCutoff = 1.0f;',
              'acquireConfidence = 0.60f,',
              'sustainConfidence = 0.40f,',
              'acquireSamples = 2,',
              'lossGraceSeconds = 0.10f,',
              'resetAfterLossSeconds = 0.25f,',
              'defaultDeltaTimeSeconds = 0.05f,',
              'maximumDeltaTimeSeconds = 0.25f,',
              'ResponsiveCanonicalA (1.5/0.25/1.0)',
              'ResponsiveCanonicalB (2.0/0.50/1.0)',
          ], 'responsive profiles/labels')

          require(runtime, [
              'private CanonicalPoseStabilizer _responsiveStabilizerA;',
              'private CanonicalPoseStabilizer _responsiveStabilizerB;',
              'private readonly CanonicalPoseFrame _responsiveCanonicalFrameA = new CanonicalPoseFrame();',
              'private readonly CanonicalPoseFrame _responsiveCanonicalFrameB = new CanonicalPoseFrame();',
              'new CanonicalPoseStabilizer(\n                CreateResponsiveAvatarSettings(ResponsiveAMinCutoff, ResponsiveABeta));',
              'new CanonicalPoseStabilizer(\n                CreateResponsiveAvatarSettings(ResponsiveBMinCutoff, ResponsiveBBeta));',
          ], 'persistent responsive state')

          update_start = runtime.index('        private void Update()')
          update_end = runtime.index('        public void BeginCalibration()', update_start)
          update = runtime[update_start:update_end]
          if 'new CanonicalPoseStabilizer' in update or 'new CanonicalPoseFrame' in update:
              raise SystemExit('per-frame stabilizer/frame allocation detected')

          require(update, [
              '_stabilizer.Stabilize(_rawCanonicalFrame, _stabilizedFrame, _lastEvaluationTimeSeconds);',
              '_calibration.Update(_stabilizedFrame, _lastEvaluationTimeSeconds);',
              '_responsiveStabilizerA.Stabilize(',
              '_responsiveCanonicalFrameA,',
              '_responsiveStabilizerB.Stabilize(',
              '_responsiveCanonicalFrameB,',
              'var avatarDriveFrame = AvatarDriveFrame;',
              '_rotationSolver.Solve(avatarDriveFrame, _calibration.Profile, _rotationFrame);',
              '_kinematicTargetBuilder.Build(avatarDriveFrame, _calibration.Profile, _kinematicTargets);',
          ], 'continuous update/solve path')
          stable_pos = update.index('_stabilizer.Stabilize(')
          calibration_pos = update.index('_calibration.Update(_stabilizedFrame')
          a_pos = update.index('_responsiveStabilizerA.Stabilize(')
          b_pos = update.index('_responsiveStabilizerB.Stabilize(')
          select_pos = update.index('var avatarDriveFrame = AvatarDriveFrame;')
          if not (stable_pos < calibration_pos < a_pos < select_pos and stable_pos < calibration_pos < b_pos < select_pos):
              raise SystemExit('stable calibration ordering or continuous responsive warm-up ordering changed')

          require(runtime, [
              'case AvatarDrivePoseSource.RawCanonical:\n                        return _rawCanonicalFrame;',
              'case AvatarDrivePoseSource.ResponsiveCanonicalA:\n                        return _responsiveCanonicalFrameA;',
              'case AvatarDrivePoseSource.ResponsiveCanonicalB:\n                        return _responsiveCanonicalFrameB;',
              'default:\n                        return _stabilizedFrame;',
          ], 'four-way AvatarDriveFrame routing')
          if any(x in runtime for x in [
              '_calibration.Update(AvatarDriveFrame',
              '_calibration.Update(_rawCanonicalFrame',
              '_calibration.Update(_responsiveCanonicalFrameA',
              '_calibration.Update(_responsiveCanonicalFrameB',
          ]):
              raise SystemExit('calibration routed through experimental avatar source')

          if locomotion.count('runtime.StabilizedFrame') < 3:
              raise SystemExit('locomotion stable-frame consumers changed')
          if any(x in locomotion for x in ['runtime.AvatarDriveFrame', 'runtime.RawCanonicalFrame', 'ResponsiveCanonical']):
              raise SystemExit('locomotion routed through experimental avatar source')
          require(retargeter, ['var sourceFrame = runtime.AvatarDriveFrame;'], 'retarget source authority')

          require(runtime, [
              '_responsiveStabilizerA?.Reset();',
              '_responsiveStabilizerB?.Reset();',
              '_responsiveCanonicalFrameA.Clear();',
              '_responsiveCanonicalFrameB.Clear();',
          ], 'responsive reset/clear')
          if runtime.count('ResetResponsiveAvatarStabilizers();') < 2:
              raise SystemExit('responsive reset helper not used by coordinate + explicit calibration reset')

          require(presenter, [
              'runtime.RawCanonicalFrame,',
              'runtime.StabilizedFrame,',
              'Avatar source: {(runtime == null ? "Unavailable" : runtime.AvatarDriveSourceLabel)}',
          ], 'raw/stable debug and F7 source diagnostic')
          require(retargeter, [
              'private bool enablePresentationSmoothing = true;',
              'private float presentationResponse = 45f;',
              'private float maxPresentationBlendSeconds = 0.05f;',
              'BoundedQuaternionPresentationSmoother',
          ], 'presentation smoothing preservation')

          if any(x in runtime for x in ['Queue<', 'ConcurrentQueue<', 'frameHistory', 'Replay', 'Extrapolat', 'Predict']):
              raise SystemExit('queue/history/replay/prediction-like state introduced')

          print('RESPONSIVE_AVATAR_STABILIZER_STATIC_AUDIT=PASS')
          print('ENUM_SERIALIZATION_STABLE_0_RAW_1=PASS')
          print('STABLE_PROFILE_UNCHANGED=PASS')
          print('RESPONSIVE_A_1.5_0.25_1.0=PASS')
          print('RESPONSIVE_B_2.0_0.50_1.0=PASS')
          print('STABLE_CALIBRATION_ORDER_PRESERVED=PASS')
          print('CONTINUOUS_PARALLEL_RESPONSIVE_UPDATES=PASS')
          print('CALIBRATION_STABLE_ONLY=PASS')
          print('LOCOMOTION_STABLE_ONLY=PASS')
          print('RETARGET_SOURCE_CONSISTENCY=PASS')
          print('RESET_LIFECYCLE=PASS')
          print('DEBUG_PRESENTATION_PRESERVED=PASS')
          PY

      - name: Validate experiment diff scope
        shell: bash
        run: |
          allowed='^(Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs|.github/workflows/responsive-avatar-stabilizer-audit.yml)$'
          changed="$(git diff --name-only c07cea3801a11ba100d5a465935906895debbf63..HEAD)"
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected files changed:'
            echo "$bad"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '(^|/)PoseTrackingSpike\.unity$|^ProjectSettings/|^Packages/|OpenVino|WebCamCpu|Plugins/|MediaPipePoseProvider|EmbodiedLocomotionController|HumanoidRetargetingMath|CanonicalPoseStabilizer\.cs|CanonicalStabilizerSettings\.cs'; then
            echo 'Forbidden scope change detected'
            exit 1
          fi

      - name: Show focused diff
        run: |
          git diff --stat c07cea3801a11ba100d5a465935906895debbf63..HEAD
          git diff c07cea3801a11ba100d5a465935906895debbf63..HEAD -- Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs
