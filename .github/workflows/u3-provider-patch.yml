name: U3 managed provider patch

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - 'Tools/OpenVinoUnityPosePlugin/scripts/apply_u3_managed_provider.py'
      - '.github/workflows/u3-provider-patch.yml'

permissions:
  contents: write

jobs:
  apply-u3-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed provider transformation
        run: python3 Tools/OpenVinoUnityPosePlugin/scripts/apply_u3_managed_provider.py

      - name: Validate generated diff
        shell: bash
        run: |
          git diff --check
          git diff -- Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs
          grep -q 'PoseInferenceBackend.OpenVinoCpuFp32' Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs
          grep -q 'LaunchPreparedOpenVinoInference' Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs
          grep -q 'OpenVINO CPU FP32' Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs

      - name: Commit generated U3 provider integration
        shell: bash
        run: |
          if git diff --quiet -- Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs; then
            echo 'Provider already matches U3 integration; nothing to commit.'
            exit 0
          fi
          git config user.name 'Golden Needle Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs
          git commit -m 'feat: wire U3 selectable OpenVINO pose backend'
          git push origin HEAD:engine/pose-tracking-spike
