name: One-shot readback source wiring

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - .github/workflows/readback-source-wiring.yml

permissions:
  contents: write

jobs:
  wire-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: engine/pose-tracking-spike
          fetch-depth: 0

      - name: Apply exact provider seam edits
        shell: python
        run: |
          from pathlib import Path

          path = Path("Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs")
          text = path.read_text(encoding="utf-8")

          class_before = "public sealed class MediaPipePoseProvider : MonoBehaviour"
          class_after = "public sealed partial class MediaPipePoseProvider : MonoBehaviour"
          call_before = "StartCoroutine(CapturePreparedFrameAsync("
          call_after = "StartCoroutine(CapturePreparedFrameOptimizedAsync("

          if text.count(class_before) != 1:
              raise SystemExit(f"expected exactly one provider class seam, found {text.count(class_before)}")
          if text.count(call_before) != 1:
              raise SystemExit(f"expected exactly one readback coroutine call seam, found {text.count(call_before)}")

          text = text.replace(class_before, class_after, 1)
          text = text.replace(call_before, call_after, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit exact wiring
        shell: bash
        run: |
          if git diff --quiet -- Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs; then
            echo "Expected provider wiring diff was not produced."
            exit 1
          fi
          git config user.name "Golden Needle Builder"
          git config user.email "actions@users.noreply.github.com"
          git add Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs
          git commit -m "feat: wire webcam CPU readback candidate"
          git push origin HEAD:engine/pose-tracking-spike
