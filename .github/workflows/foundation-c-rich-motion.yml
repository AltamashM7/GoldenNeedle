name: Foundation C rich motion

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - 'Assets/GoldenNeedle/Core/Motion/Rich/**'
      - 'Assets/GoldenNeedle/Core/Motion/Rich.meta'
      - 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeRichMotionEvidenceMapper.cs'
      - 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeRichMotionEvidenceMapper.cs.meta'
      - 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCanonicalPoseSource.cs'
      - 'Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs'
      - 'Assets/GoldenNeedle/Tests/Editor/FoundationCRichMotionTests.cs'
      - 'Assets/GoldenNeedle/Tests/Editor/FoundationCRichMotionTests.cs.meta'
      - 'Tools/FoundationCRichMotionSmoke/**'
      - '.github/workflows/foundation-c-rich-motion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Foundation A command and speech smoke
        run: dotnet run --configuration Release --project Tools/FoundationACommandSmoke/FoundationACommandSmoke.csproj

      - name: Run Foundation B camera preset smoke
        run: dotnet run --configuration Release --project Tools/FoundationBCameraSmoke/FoundationBCameraSmoke.csproj

      - name: Run Foundation C rich motion smoke
        run: dotnet run --configuration Release --project Tools/FoundationCRichMotionSmoke/FoundationCRichMotionSmoke.csproj

      - name: Validate Foundation C architecture and scope
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          task_base = '8908ca580c8c7251238f75191345d4bf2b5fd04e'
          canonical = Path('Assets/GoldenNeedle/Core/Motion/Canonical/CanonicalPoseFrame.cs').read_text(encoding='utf-8')
          legacy_source = Path('Assets/GoldenNeedle/Core/Motion/Runtime/ICanonicalPoseSource.cs').read_text(encoding='utf-8')
          runtime = Path('Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs').read_text(encoding='utf-8')
          legacy_solver = Path('Assets/GoldenNeedle/Core/Motion/Rotation/CanonicalRotationSolver.cs').read_text(encoding='utf-8')
          retargeter = Path('Assets/GoldenNeedle/Core/Motion/Retargeting/HumanoidRetargeter.cs').read_text(encoding='utf-8')
          rich_frame = Path('Assets/GoldenNeedle/Core/Motion/Rich/RichMotionFrame.cs').read_text(encoding='utf-8')
          rich_solver = Path('Assets/GoldenNeedle/Core/Motion/Rich/RichAnatomicalOrientationSolver.cs').read_text(encoding='utf-8')
          rich_interface = Path('Assets/GoldenNeedle/Core/Motion/Rich/IRichMotionEvidenceSource.cs').read_text(encoding='utf-8')
          mapper = Path('Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeRichMotionEvidenceMapper.cs').read_text(encoding='utf-8')
          media_source = Path('Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCanonicalPoseSource.cs').read_text(encoding='utf-8')
          workflow_a = Path('.github/workflows/foundation-a-command-system.yml').read_text(encoding='utf-8')
          workflow_b = Path('.github/workflows/foundation-b-camera-presets.yml').read_text(encoding='utf-8')
          workflow_c = Path('.github/workflows/foundation-c-rich-motion.yml').read_text(encoding='utf-8')

          def require(text, markers, label):
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{label}: missing {missing}')

          require(canonical, [
              'Pelvis = 0,', 'Spine = 1,', 'Chest = 2,', 'Head = 3,',
              'LeftShoulder = 4,', 'LeftElbow = 5,', 'LeftWrist = 6,',
              'RightShoulder = 7,', 'RightElbow = 8,', 'RightWrist = 9,',
              'LeftHip = 10,', 'LeftKnee = 11,', 'LeftAnkle = 12,',
              'LeftHeel = 13,', 'LeftToe = 14,', 'RightHip = 15,',
              'RightKnee = 16,', 'RightAnkle = 17,', 'RightHeel = 18,',
              'RightToe = 19,', 'public const int JointCount = 20;'
          ], 'CanonicalBodyV1 compatibility')

          rich_core = rich_frame + '\n' + rich_solver + '\n' + rich_interface
          if 'Quaternion' in rich_core:
              raise SystemExit('rich canonical authority must not store/use Quaternion')
          if any(token in rich_core for token in ['PoseObservation', 'PoseLandmarkObservation', 'MediaPipePoseProvider', 'GetLandmark(']):
              raise SystemExit('provider-native MediaPipe types/indices leaked into rich core')

          require(rich_frame, [
              'public const int EvidenceCount = 22;', 'public const int OrientationChannelCount = 12;',
              'public struct CanonicalAnatomicalBasis', 'public Vector3 primaryAxis;',
              'public Vector3 secondaryAxis;', 'public Vector3 thirdAxis;',
              'public float determinant;', 'CanonicalAnatomicalHandedness handedness;',
              'Observed = 1,', 'Held = 2,', 'ReferenceFallback = 3,', 'Unobservable = 0,',
              'public int validOrientationCount', 'public int observedTwistCount',
              'public int heldTwistCount', 'public int referenceFallbackTwistCount',
          ], 'rich motion schema')
          require(rich_solver, [
              'private static readonly ChannelDescriptor[] Descriptors',
              'RichOrientationChannelId.Pelvis', 'RichOrientationChannelId.Chest',
              'RichOrientationChannelId.LeftUpperArm', 'RichOrientationChannelId.RightUpperArm',
              'RichOrientationChannelId.LeftLowerArm', 'RichOrientationChannelId.RightLowerArm',
              'RichOrientationChannelId.LeftUpperLeg', 'RichOrientationChannelId.RightUpperLeg',
              'RichOrientationChannelId.LeftLowerLeg', 'RichOrientationChannelId.RightLowerLeg',
              'RichOrientationChannelId.LeftFoot', 'RichOrientationChannelId.RightFoot',
              'TryBuildBasis(', 'Vector3.Cross(primary, secondary)',
              'RichTwistObservability.Observed', 'RichTwistObservability.Held',
              'RichTwistObservability.ReferenceFallback',
              'ResetReferenceState()', 'referenceFallbackAfterSeconds',
          ], 'rich orientation solver')

          if 'IRichMotionEvidenceSource' in legacy_source or 'RichMotion' in legacy_source:
              raise SystemExit('ICanonicalPoseSource was destructively expanded')
          require(rich_interface, ['public interface IRichMotionEvidenceSource', 'TryCopyLatestRichMotionEvidence'], 'optional rich source boundary')
          require(mapper, [
              'DirectSourceIndices', '11, 12,', '17, 18,', '21, 22,', '29, 30,', '31, 32,',
              'CanonicalCoordinateSystem.MediaPipeWorldToCanonical',
              'RichMotionEvidenceId.LeftThumb', 'RichMotionEvidenceId.RightThumb',
              'RichMotionEvidenceId.LeftPinky', 'RichMotionEvidenceId.RightPinky',
          ], 'MediaPipe rich mapper')
          require(media_source, [
              'ICanonicalPoseSource, IRichMotionEvidenceSource',
              'private readonly PoseObservation _observation = new PoseObservation();',
              'MediaPipeRichMotionEvidenceMapper.Map(',
          ], 'MediaPipe optional rich source')
          rich_method = media_source[media_source.index('public bool TryCopyLatestRichMotionEvidence'):]
          if 'provider.CopyLatestObservation' in rich_method:
              raise SystemExit('rich capability performs a second provider observation copy/inference path')

          stable_calibration = '''_stabilizer.Stabilize(_rawCanonicalFrame, _stabilizedFrame, _lastEvaluationTimeSeconds);\n            _calibration.Update(_stabilizedFrame, _lastEvaluationTimeSeconds);'''
          if stable_calibration not in runtime:
              raise SystemExit('accepted stable stabilizer -> calibration adjacency changed')
          require(runtime, [
              'private IRichMotionEvidenceSource _richSource;',
              'public RichMotionFrame RichMotionFrame => _richMotionFrame;',
              '_rotationSolver.Solve(avatarDriveFrame, _calibration.Profile, _rotationFrame);',
              '_kinematicTargetBuilder.Build(avatarDriveFrame, _calibration.Profile, _kinematicTargets);',
              'UpdateRichMotion();', 'ResetReferenceState();',
          ], 'additive runtime integration')
          if runtime.index('UpdateRichMotion();') < runtime.index('_kinematicTargetBuilder.Build('):
              raise SystemExit('rich side path must not replace/preempt accepted production rotation/IK output')

          if 'Quaternion.FromToRotation' not in legacy_solver:
              raise SystemExit('legacy swing-only CanonicalRotationSolver was replaced')
          if 'runtime.AvatarDriveFrame' not in retargeter:
              raise SystemExit('Phase 4 retargeter no longer consumes accepted AvatarDriveFrame')
          if 'RichMotionFrame' in retargeter or 'RichOrientation' in retargeter:
              raise SystemExit('Foundation C must not switch production retargeting to rich orientation')

          for path in Path('Assets/GoldenNeedle/Core/Motion').rglob('*.cs'):
              text = path.read_text(encoding='utf-8')
              if 'GetLandmark(' not in text:
                  continue
              normalized = path.as_posix()
              if '/Providers/MediaPipe/' in normalized or normalized.endswith('/Canonical/MediaPipeCanonicalPoseMapper.cs'):
                  continue
              raise SystemExit(f'provider landmark access leaked downstream: {normalized}')

          for text, name in [(workflow_a, 'Foundation A'), (workflow_b, 'Foundation B'), (workflow_c, 'Foundation C')]:
              if 'contents: read' not in text:
                  raise SystemExit(f'{name} workflow is not contents: read')
              forbidden = ['git ' + 'push ', 'git ' + 'commit ', 'contents:' + ' write']
              found = [item for item in forbidden if item in text]
              if found:
                  raise SystemExit(f'{name} workflow is not read-only: {found}')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', task_base, 'HEAD'], text=True).splitlines()
          allowed_prefixes = (
              'Assets/GoldenNeedle/Core/Motion/Rich',
              'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeRichMotionEvidenceMapper.cs',
              'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCanonicalPoseSource.cs',
              'Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs',
              'Assets/GoldenNeedle/Tests/Editor/FoundationCRichMotionTests.cs',
              'Tools/FoundationCRichMotionSmoke/',
              '.github/workflows/foundation-c-rich-motion.yml',
              'Docs/current-state.md',
              'Docs/decisions.md',
          )
          unexpected = [path for path in changed if not path.startswith(allowed_prefixes)]
          if unexpected:
              raise SystemExit(f'Foundation C diff escaped approved scope: {unexpected}')
          if any(path.endswith('.unity') or path.startswith('Packages/') or path.startswith('ProjectSettings/') for path in changed):
              raise SystemExit('scene/package/project-settings change detected')

          print('FOUNDATION_C_STATIC_AUDIT=PASS')
          print('CANONICAL_BODY_V1_COMPATIBILITY=PASS')
          print('RICH_CANONICAL_NO_QUATERNION_AUTHORITY=PASS')
          print('MEDIAPIPE_INDEX_ISOLATION=PASS')
          print('OPTIONAL_RICH_SOURCE_BOUNDARY=PASS')
          print('LEGACY_ROTATION_RETARGET_PATH_PRESERVED=PASS')
          print('FOUNDATION_A_B_READ_ONLY_PRESERVED=PASS')
          print('FOUNDATION_C_DIFF_SCOPE=PASS')
          PY

      - name: Assert verification is read-only
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          echo 'FOUNDATION_C_WORKFLOW_READ_ONLY=PASS'
