name: Foundation A command system

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - 'Assets/GoldenNeedle/Core/Commands/**'
      - 'Assets/GoldenNeedle/Debug/PoseTrackingSpike/PoseTrackingSpikePresenter.cs'
      - 'Assets/GoldenNeedle/Debug/PoseTrackingSpike/WindowsKeywordSpeechProvider.cs'
      - 'Assets/GoldenNeedle/Tests/Editor/FoundationACommandSystemTests.cs'
      - 'Tools/FoundationACommandSmoke/**'
      - '.github/workflows/foundation-a-command-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Run pure command and speech policy smoke
        run: dotnet run --configuration Release --project Tools/FoundationACommandSmoke/FoundationACommandSmoke.csproj

      - name: Validate permanent Foundation A invariants
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          command = Path('Assets/GoldenNeedle/Core/Commands/GoldenNeedleCommand.cs').read_text(encoding='utf-8')
          policy = Path('Assets/GoldenNeedle/Core/Commands/SpeechCommandPolicy.cs').read_text(encoding='utf-8')
          speech_input = Path('Assets/GoldenNeedle/Core/Commands/SpeechCommandInput.cs').read_text(encoding='utf-8')
          presenter = Path('Assets/GoldenNeedle/Debug/PoseTrackingSpike/PoseTrackingSpikePresenter.cs').read_text(encoding='utf-8')
          windows = Path('Assets/GoldenNeedle/Debug/PoseTrackingSpike/WindowsKeywordSpeechProvider.cs').read_text(encoding='utf-8')
          camera = Path('Assets/GoldenNeedle/Debug/PoseTrackingSpike/ThirdPersonLabCamera.cs').read_text(encoding='utf-8')
          provider = Path('Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs').read_text(encoding='utf-8')
          locomotion = Path('Assets/GoldenNeedle/Core/Motion/Locomotion/EmbodiedLocomotionController.cs').read_text(encoding='utf-8')
          runtime = Path('Assets/GoldenNeedle/Core/Motion/Runtime/MotionEngineRuntime.cs').read_text(encoding='utf-8')

          def require(text, markers, label):
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{label}: missing {missing}')

          require(command, [
              'public enum GoldenNeedleCommand',
              'public sealed class GoldenNeedleCommandRouter',
              'BeginCalibration,', 'ResetCalibration,', 'Recenter,', 'RetryTracking,',
              'ToggleLabGamePresentation,', 'SetLabPresentation,', 'SetGamePresentation,',
              'SelectCameraViewPreset,', 'public string parameter;',
          ], 'shared command model/router')

          require(policy, [
              'public float commandCooldownSeconds = 0.75f;',
              'public SpeechRecognitionConfidence minimumConfidence = SpeechRecognitionConfidence.Medium;',
              'public string wakePrefix = string.Empty;',
              'NormalizePhrase(', 'BuildEffectivePhrase(', 'Ambiguous speech phrase:',
          ], 'speech policy')

          create_default = policy[policy.index('public static SpeechCommandConfiguration CreateDefault()'):policy.index('public sealed class SpeechCommandResolver')]
          default_phrases = [
              'begin calibration', 'reset calibration', 'recenter', 'retry tracking',
              'game view', 'lab view', 'back view', 'front view', 'left view', 'right view',
              'full body view', 'hands view', 'left hand view', 'right hand view',
          ]
          for phrase in default_phrases:
              if f'"{phrase}"' not in create_default:
                  raise SystemExit(f'default speech phrase changed/missing: {phrase}')
          if create_default.count('SpeechRecognitionConfidence.Low') != 14:
              raise SystemExit('all 14 default speech mappings must explicitly require Low confidence')
          if 'wakePrefix = string.Empty,' not in create_default:
              raise SystemExit('default wake prefix is no longer empty')

          require(speech_input, [
              'public interface ISpeechInputProvider : IDisposable',
              'public enum SpeechProviderLifecycleState',
              'public enum SpeechRecognitionOutcome',
              'public interface ISpeechInputProviderDiagnostics',
              'public long RecognitionEventCount',
              'public SpeechRecognitionConfidence LastRawConfidence',
              'public bool LastMappingFound',
              'public bool LastConfidenceRejected',
              'public bool LastCooldownRejected',
              'public bool LastDispatchAttempted',
              '_resolver.TryResolve(', '_cooldown.CanDispatch(',
              'result = _dispatcher.Execute(request);', '_cooldown.MarkDispatched(now);',
              'provider.PhraseRecognized -= OnPhraseRecognized;', 'provider.Dispose();',
          ], 'speech input boundary and diagnostics')
          if any(token in speech_input for token in ['Keyboard.current', 'InputSystem']):
              raise SystemExit('speech input must not simulate keyboard input')
          if any('UnityEngine' in text for text in [command, policy, speech_input]):
              raise SystemExit('core command/speech policy must remain platform-neutral')

          require(windows, [
              '#if UNITY_STANDALONE_WIN || UNITY_EDITOR_WIN || UNITY_WSA',
              'using UnityEngine.Windows.Speech;', 'PhraseRecognitionSystem.isSupported',
              'PhraseRecognitionSystem.Status',
              'PhraseRecognitionSystem.OnStatusChanged += HandlePhraseSystemStatusChanged;',
              'PhraseRecognitionSystem.OnStatusChanged -= HandlePhraseSystemStatusChanged;',
              'PhraseRecognitionSystem.OnError += HandlePhraseSystemError;',
              'PhraseRecognitionSystem.OnError -= HandlePhraseSystemError;',
              'new KeywordRecognizer(_keywords, ConfidenceLevel.Low)',
              '_recognizer.OnPhraseRecognized += HandlePhraseRecognized;',
              '_recognizer.OnPhraseRecognized -= HandlePhraseRecognized;',
              '_recognizer.Stop();', '_recognizer.Dispose();',
              'var devices = Microphone.devices;',
              'SpeechError.MicrophoneUnavailable',
          ], 'Windows speech backend lifecycle/observability')
          forbidden_windows = [
              'Microphone.Start(',
              'RequestUserAuthorization(',
              'BeginCalibration', 'ResetCalibration', '.Recenter(', 'ToggleGameView', 'RequestCycleCamera',
          ]
          found_windows = [token for token in forbidden_windows if token in windows]
          if found_windows:
              raise SystemExit(f'Windows speech backend crossed input/permission boundary: {found_windows}')

          require(presenter, [
              'private GoldenNeedleCommandRouter _commandRouter;',
              'private SpeechCommandInput _speechCommandInput;',
              'public GoldenNeedleCommandResult SubmitCommand(',
              'new GoldenNeedleCommandRouter(targets);',
              'phrases => new WindowsKeywordSpeechProvider(phrases)',
              '_speechCommandInput.DiagnosticSummary',
          ], 'presenter wiring and Lab diagnostics')

          update_start = presenter.index('        private void Update()')
          on_gui_start = presenter.index('        private void OnGUI()', update_start)
          update = presenter[update_start:on_gui_start]
          routes = [
              ('rKey', 'RetryTracking'), ('vKey', 'CycleCaptureCameraDevice'),
              ('f1Key', 'ToggleRawLandmarks'), ('f2Key', 'ToggleCanonical2D'),
              ('f3Key', 'ToggleCanonical3D'), ('f4Key', 'ToggleStabilized2D'),
              ('f5Key', 'ToggleRigDrive'), ('f6Key', 'ToggleCoordinateDiagnostic'),
              ('f7Key', 'ToggleMainDiagnostics'), ('f8Key', 'ToggleProceduralRigViewport'),
              ('f9Key', 'ToggleLocomotionDiagnostics'), ('f10Key', 'ToggleLocomotionWorldView'),
              ('f11Key', 'ToggleAllDebugPresentation'), ('f12Key', 'ToggleLabGamePresentation'),
              ('cKey', 'BeginCalibration'), ('xKey', 'ResetCalibration'), ('kKey', 'Recenter'),
          ]
          for key, action in routes:
              if key not in update or f'SubmitKeyboardCommand(GoldenNeedleCommand.{action});' not in update:
                  raise SystemExit(f'keyboard route missing/mismatched: {key} -> {action}')
          forbidden_direct = [
              'provider.Retry(', 'provider.RequestCycleCamera(', 'runtime.BeginCalibration(',
              'runtime.ResetCalibration(', 'locomotion.Recenter(', 'gameViewCamera.ToggleGameView(',
          ]
          if any(item in update for item in forbidden_direct):
              raise SystemExit('keyboard Update still bypasses shared command routing')

          require(camera, ['public void ToggleGameView()', 'public void SetGameViewActive(bool active)', 'controlledCamera.cullingMask = 0;'], 'presentation authority')
          require(provider, ['public void Retry()', 'public bool RequestCycleCamera()', 'public bool RequestCameraSwitch(string preferredName)'], 'provider authorities')
          require(locomotion, ['public void Recenter()'], 'locomotion authority')
          require(runtime, ['public void BeginCalibration()', 'public void ResetCalibration()'], 'calibration authorities')

          print('FOUNDATION_A_STATIC_AUDIT=PASS')
          print('SHARED_COMMAND_ROUTING=PASS')
          print('KEYBOARD_MIGRATION_F1_F12_R_V_C_X_K=PASS')
          print('SPEECH_POLICY_AND_PROVIDER_BOUNDARY=PASS')
          print('DEFAULT_SPEECH_ALL_LOW=PASS')
          print('SPEECH_WINDOWS_STATUS_ERROR_LIFECYCLE=PASS')
          print('SPEECH_NO_PARALLEL_MIC_CAPTURE_OR_WINDOWS_AUTH_PROMPT=PASS')
          print('SPEECH_LAB_DIAGNOSTICS_SURFACE=PASS')
          print('EXISTING_RUNTIME_AUTHORITIES_PRESERVED=PASS')
          PY

      - name: Assert verification is read-only
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          echo 'FOUNDATION_A_WORKFLOW_READ_ONLY=PASS'
