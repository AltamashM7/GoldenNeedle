name: OpenVINO Unity plugin recovery proof

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - 'Tools/OpenVinoUnityPosePlugin/**'
      - 'Assets/GoldenNeedle/Plugins/OpenVinoPose/**'
      - 'Assets/StreamingAssets/GoldenNeedle/OpenVinoPoseModels/**'
      - '.github/workflows/openvino-unity-plugin.yml'
  workflow_dispatch:

jobs:
  u2-native-backend:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homuler MSYS2 build utilities
        shell: pwsh
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm --needed git patch unzip zip"

      - name: Bootstrap exact pinned native sources and OpenVINO runtime
        shell: pwsh
        run: .\Tools\OpenVinoUnityPosePlugin\scripts\bootstrap.ps1

      - name: Build U2 x64 Release and run lifecycle + real-frame semantic smoke
        shell: pwsh
        run: .\Tools\OpenVinoUnityPosePlugin\scripts\build.ps1

      - name: Package additively into Unity assets and smoke packaged DLL
        shell: pwsh
        run: .\Tools\OpenVinoUnityPosePlugin\scripts\package_unity.ps1 -RepoRoot $PWD
