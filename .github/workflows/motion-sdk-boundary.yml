name: Motion SDK product boundary

on:
  push:
    branches: [gameplay/foundation, codex/motion-sdk-integration, main]
    paths: [Assets/**, Packages/**, Tools/**, Docs/motion-sdk-*, .github/workflows/**]
  pull_request:
    paths: [Assets/**, Packages/**, Tools/**, Docs/motion-sdk-*, .github/workflows/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed compiled SDK and product ownership
        run: python Tools/verify_motion_sdk_boundary.py
