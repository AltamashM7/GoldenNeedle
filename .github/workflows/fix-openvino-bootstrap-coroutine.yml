name: Fix OpenVINO bootstrap coroutine compile error

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - '.github/workflows/fix-openvino-bootstrap-coroutine.yml'

permissions:
  contents: write

jobs:
  patch-provider:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: engine/pose-tracking-spike

      - name: Patch BootstrapAsync iterator structure
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path(r"Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs")
          text = path.read_text(encoding="utf-8")
          nl = "\r\n" if "\r\n" in text else "\n"

          old = '''            try
            {
                if (inferenceBackend == PoseInferenceBackend.OpenVinoCpuFp32)
                {
                    var detectorPath = Path.Combine(
                        Application.streamingAssetsPath,
                        OpenVinoModelDirectory,
                        OpenVinoDetectorModelFileName);
                    var landmarkPath = Path.Combine(
                        Application.streamingAssetsPath,
                        OpenVinoModelDirectory,
                        OpenVinoLandmarkModelFileName);
                    if (!File.Exists(detectorPath) || !File.Exists(landmarkPath))
                    {
                        throw new FileNotFoundException(
                            "Generated OpenVINO detector/landmark files are missing. Run Tools/OpenVinoUnityPosePlugin/scripts/package_unity.ps1 before selecting the experimental backend.");
                    }

                    var bootstrapTask = Task.Run(() => OpenVinoPoseRuntime.Create(detectorPath, landmarkPath));
                    _openVinoBootstrapTask = bootstrapTask;
                    while (!bootstrapTask.IsCompleted)
                    {
                        yield return null;
                    }
                    _openVinoBootstrapTask = null;
                    if (bootstrapTask.IsCanceled)
                    {
                        throw new OperationCanceledException("OpenVINO pose runtime initialization was canceled.");
                    }
                    if (bootstrapTask.IsFaulted)
                    {
                        throw bootstrapTask.Exception?.GetBaseException() ??
                            new InvalidOperationException("OpenVINO pose runtime initialization failed.");
                    }

                    _openVinoPoseRuntime = bootstrapTask.Result;
                    _activeInferenceBackend = PoseInferenceBackend.OpenVinoCpuFp32;
                    OpenVinoRuntimeInfo = _openVinoPoseRuntime.RuntimeInfo;
                    OpenVinoEngineInfo = _openVinoPoseRuntime.EngineInfo;
                }
                else
'''.replace("\n", nl)

          new = '''            Task<OpenVinoPoseRuntime> bootstrapTask = null;
            if (inferenceBackend == PoseInferenceBackend.OpenVinoCpuFp32)
            {
                var detectorPath = Path.Combine(
                    Application.streamingAssetsPath,
                    OpenVinoModelDirectory,
                    OpenVinoDetectorModelFileName);
                var landmarkPath = Path.Combine(
                    Application.streamingAssetsPath,
                    OpenVinoModelDirectory,
                    OpenVinoLandmarkModelFileName);
                if (!File.Exists(detectorPath) || !File.Exists(landmarkPath))
                {
                    SetFailure(
                        PoseProviderStatus.ModelFailed,
                        "Generated OpenVINO detector/landmark files are missing. Run Tools/OpenVinoUnityPosePlugin/scripts/package_unity.ps1 before selecting the experimental backend.");
                    CleanupRuntime();
                    yield break;
                }

                bootstrapTask = Task.Run(() => OpenVinoPoseRuntime.Create(detectorPath, landmarkPath));
                _openVinoBootstrapTask = bootstrapTask;
                while (!bootstrapTask.IsCompleted)
                {
                    yield return null;
                }
                _openVinoBootstrapTask = null;
            }

            try
            {
                if (inferenceBackend == PoseInferenceBackend.OpenVinoCpuFp32)
                {
                    if (bootstrapTask.IsCanceled)
                    {
                        throw new OperationCanceledException("OpenVINO pose runtime initialization was canceled.");
                    }
                    if (bootstrapTask.IsFaulted)
                    {
                        throw bootstrapTask.Exception?.GetBaseException() ??
                            new InvalidOperationException("OpenVINO pose runtime initialization failed.");
                    }

                    _openVinoPoseRuntime = bootstrapTask.Result;
                    _activeInferenceBackend = PoseInferenceBackend.OpenVinoCpuFp32;
                    OpenVinoRuntimeInfo = _openVinoPoseRuntime.RuntimeInfo;
                    OpenVinoEngineInfo = _openVinoPoseRuntime.EngineInfo;
                }
                else
'''.replace("\n", nl)

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one BootstrapAsync block, found {text.count(old)}")

          patched = text.replace(old, new, 1)
          path.write_text(patched, encoding="utf-8", newline="")
          print("OPENVINO_BOOTSTRAP_COROUTINE_PATCH=PASS")
          '@ | python -

      - name: Guard against CS1626 pattern
        shell: pwsh
        run: |
          $path = 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs'
          $text = Get-Content $path -Raw
          if ($text -notmatch 'Task<OpenVinoPoseRuntime> bootstrapTask = null;') {
            throw 'Expected pre-try OpenVINO bootstrap task declaration was not installed.'
          }
          if ($text -notmatch 'while \(!bootstrapTask\.IsCompleted\)') {
            throw 'Expected OpenVINO bootstrap wait loop is missing.'
          }
          Write-Host 'OPENVINO_BOOTSTRAP_CS1626_GUARD=PASS'

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }
          git commit -m "fix: move OpenVINO coroutine yield outside catchable try"
          git push origin HEAD:engine/pose-tracking-spike
