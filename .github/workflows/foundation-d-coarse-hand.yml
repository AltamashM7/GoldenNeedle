name: Foundation D coarse hand signal

on:
  push:
    branches:
      - engine/pose-tracking-spike
    paths:
      - 'Assets/GoldenNeedle/Core/Motion/Hands/CoarseHandState*.cs'
      - 'Assets/GoldenNeedle/Core/Motion/Hands/CoarseHandState*.cs.meta'
      - 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCoarseHandEvidenceMapper.cs'
      - 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCoarseHandEvidenceMapper.cs.meta'
      - 'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCanonicalPoseSource.cs'
      - 'Assets/GoldenNeedle/Debug/PoseTrackingSpike/CoarseHandLabDiagnostics.cs'
      - 'Assets/GoldenNeedle/Debug/PoseTrackingSpike/CoarseHandLabDiagnostics.cs.meta'
      - 'Tools/FoundationDHandSmoke/**'
      - '.github/workflows/foundation-d-coarse-hand.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run accepted Foundation A command and speech smoke
        run: dotnet run --configuration Release --project Tools/FoundationACommandSmoke/FoundationACommandSmoke.csproj

      - name: Run Foundation D hand and coarse signal smoke
        run: dotnet run --configuration Release --project Tools/FoundationDHandSmoke/FoundationDHandSmoke.csproj

      - name: Validate Batch 4A zero-extra-inference architecture
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          batch4a_base = '479229daaa39578c10a69d440c03ccc641e30cd2'
          coarse_contract = Path('Assets/GoldenNeedle/Core/Motion/Hands/CoarseHandState.cs').read_text(encoding='utf-8')
          coarse_estimator = Path('Assets/GoldenNeedle/Core/Motion/Hands/CoarseHandStateEstimator.cs').read_text(encoding='utf-8')
          coarse_mapper = Path('Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCoarseHandEvidenceMapper.cs').read_text(encoding='utf-8')
          source = Path('Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipeCanonicalPoseSource.cs').read_text(encoding='utf-8')
          diagnostics = Path('Assets/GoldenNeedle/Debug/PoseTrackingSpike/CoarseHandLabDiagnostics.cs').read_text(encoding='utf-8')
          retarget_detail = Path('Assets/GoldenNeedle/Core/Motion/Retargeting/RichHumanoidDetailRetargeter.cs').read_text(encoding='utf-8')
          canonical = Path('Assets/GoldenNeedle/Core/Motion/Canonical/CanonicalPoseFrame.cs').read_text(encoding='utf-8')
          smoke = Path('Tools/FoundationDHandSmoke/CoarseHandStateSmoke.cs').read_text(encoding='utf-8')

          def require(text, markers, label):
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise SystemExit(f'{label}: missing {missing}')

          require(coarse_contract, [
              'public enum CoarseHandState', 'Unknown = 0', 'Open = 1', 'Closed = 2',
              'public struct CoarseHandPoseEvidence', 'public struct CoarseHandMetrics',
              'public sealed class CoarseHandFrame', 'public interface ICoarseHandStateSource',
              'confirmationSamples = 2', 'unknownSamplesToClear = 2',
              'staleAfterMilliseconds = 350f',
          ], 'provider-independent coarse hand contract')
          require(coarse_estimator, [
              'forearmLength', 'indexExtension', 'pinkyExtension', 'indexPinkySpread', 'thumbExtension',
              'CoarseHandUnknownReason.LowConfidence', 'CoarseHandUnknownReason.AmbiguousGeometry',
              'evidence.sourceTimestampMillisec == _lastTimestamp',
              'ageMilliseconds > settings.staleAfterMilliseconds',
          ], 'coarse hand estimator/stability')

          if 'MediaPipe' in coarse_contract or 'MediaPipe' in coarse_estimator:
              raise SystemExit('provider knowledge leaked into coarse hand core')

          require(coarse_mapper, [
              'LeftElbow = 13', 'RightElbow = 14',
              'LeftWrist = 15', 'RightWrist = 16',
              'LeftPinky = 17', 'RightPinky = 18',
              'LeftIndex = 19', 'RightIndex = 20',
              'LeftThumb = 21', 'RightThumb = 22',
              'CanonicalCoordinateSystem.MediaPipeWorldToCanonical',
          ], 'pose semantic evidence boundary')

          require(source, [
              'ICanonicalPoseSource, IRichMotionEvidenceSource, ICanonicalHandSource, ICoarseHandStateSource',
              'private bool enableDetailedHands = false;',
              'provider.CopyLatestObservation(_observation);',
              'UpdateCoarseHandsFromObservation();',
              'MediaPipeCoarseHandEvidenceMapper.Map(',
              'TryCopyLatestCoarseHands(',
          ], 'coarse hand source wiring')
          copy_index = source.index('provider.CopyLatestObservation(_observation);')
          coarse_index = source.index('UpdateCoarseHandsFromObservation();', copy_index)
          map_index = source.index('MediaPipeCanonicalPoseMapper.Map(', copy_index)
          if not (copy_index < coarse_index < map_index):
              raise SystemExit('coarse hand estimate is not derived from the already-copied body observation')

          coarse_method = source[source.index('private void UpdateCoarseHandsFromObservation()'):]
          forbidden_runtime = [
              'GetPixels32', 'WebCamTexture', 'RenderTexture', 'AsyncGPUReadback',
              'HandLandmarker', 'DetectAsync', 'OpenVino', 'Mailbox', 'Queue<', 'ConcurrentQueue<',
          ]
          for label, text in [
              ('coarse contract', coarse_contract),
              ('coarse estimator', coarse_estimator),
              ('coarse provider mapper', coarse_mapper),
              ('coarse source method', coarse_method),
              ('coarse diagnostics', diagnostics),
          ]:
              found = [token for token in forbidden_runtime if token in text]
              if found:
                  raise SystemExit(f'{label} introduced extra capture/inference machinery: {found}')

          forbidden_application = [
              'HumanPoseHandler', 'HumanBodyBones', 'localRotation', 'Quaternion',
              'enableRichLimbAxialDetail = true',
          ]
          combined_coarse = coarse_contract + coarse_estimator + coarse_mapper + diagnostics
          found = [token for token in forbidden_application if token in combined_coarse]
          if found:
              raise SystemExit(f'Batch 4A crossed into avatar hand application: {found}')

          if 'private bool enableRichLimbAxialDetail = false;' not in retarget_detail:
              raise SystemExit('Batch 2 rich axial production default was not preserved')
          if 'public const int JointCount = 20;' not in canonical or 'RightToe = 19,' not in canonical:
              raise SystemExit('CanonicalBodyV1 20-joint contract changed')

          locked_paths = [
              'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/MediaPipePoseProvider.cs',
              'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/PoseObservation.cs',
              'Assets/GoldenNeedle/Core/Motion/Providers/MediaPipe/WebCamCpuFramePreparation.cs',
              'Assets/GoldenNeedle/Core/Motion/Canonical/CanonicalPoseFrame.cs',
              'Assets/GoldenNeedle/Core/Motion/Rotation/CanonicalRotationSolver.cs',
              'Assets/GoldenNeedle/Core/Motion/Locomotion/EmbodiedLocomotionController.cs',
              'Assets/GoldenNeedle/Core/Motion/Retargeting/RichHumanoidDetailRetargeter.cs',
              'Assets/GoldenNeedle/Core/Commands/SpeechCommandInput.cs',
              'Assets/GoldenNeedle/Core/Commands/SpeechCommandPolicy.cs',
              'Assets/GoldenNeedle/Debug/PoseTrackingSpike/WindowsKeywordSpeechProvider.cs',
              'Assets/GoldenNeedle/Core/Motion/Hands/HandMotionRuntime.cs',
          ]
          changed_locked = []
          for path in locked_paths:
              if subprocess.run(['git', 'diff', '--quiet', batch4a_base, 'HEAD', '--', path]).returncode != 0:
                  changed_locked.append(path)
          if changed_locked:
              raise SystemExit(f'Batch 4A changed protected prior-batch/runtime paths: {changed_locked}')

          require(diagnostics, [
              'MainDiagnosticsVisible', 'AllDebugPresentationHidden',
              'TryCopyLatestCoarseHands(', 'CoarseHandDiagnosticSummary',
          ], 'Lab coarse hand diagnostics')
          require(smoke, [
              'COARSE_HAND_GEOMETRY=PASS',
              'COARSE_HAND_CONFIDENCE_AMBIGUITY=PASS',
              'COARSE_HAND_SCALE_INVARIANT=PASS',
              'COARSE_HAND_LEFT_RIGHT_INDEPENDENT=PASS',
              'COARSE_HAND_TEMPORAL_STABILITY=PASS',
              'COARSE_HAND_DUPLICATE_TIMESTAMP=PASS',
              'COARSE_HAND_STALE_TO_UNKNOWN=PASS',
          ], 'coarse hand deterministic smoke surface')

          print('COARSE_HAND_ZERO_EXTRA_INFERENCE=PASS')
          print('COARSE_HAND_POSE_SEMANTIC_BOUNDARY=PASS')
          print('COARSE_HAND_CANONICAL_BODY_V1_UNCHANGED=PASS')
          print('BATCH1_DETAILED_HAND_DEFAULT_OFF=PASS')
          print('BATCH2_RICH_AXIAL_DEFAULT_OFF=PASS')
          print('BATCH3_SPEECH_UNCHANGED=PASS')
          print('BATCH4A_NO_AVATAR_FINGER_APPLICATION=PASS')
          print('COARSE_HAND_LAB_DIAGNOSTICS=PASS')
          PY

      - name: Assert verification is read-only
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          echo 'FOUNDATION_D_COARSE_WORKFLOW_READ_ONLY=PASS'
